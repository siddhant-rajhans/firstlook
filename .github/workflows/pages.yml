name: pages

# Builds the firstlook wheel into web/ and deploys the playground to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions. Then run this
# workflow (Actions -> pages -> Run workflow), or push to main.

on:
  workflow_dispatch:   # run manually after enabling Pages (Settings -> Pages -> GitHub Actions)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel into web/
        run: |
          pip install build
          python -m build --wheel
          cp dist/*.whl web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
