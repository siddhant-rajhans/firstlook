name: publish

# Builds and publishes to PyPI when you cut a GitHub Release.
# Uses PyPI Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on PyPI: add a "pending publisher" for project `firstlook`,
# owner `siddhant-rajhans`, repo `firstlook`, workflow `publish.yml`.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
